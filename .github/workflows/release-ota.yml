# Build and publish a signed ESP32-C3 CrowMotion release.
name: release-ota

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Validate release tag
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::release tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac

      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify tag matches firmware version
        run: |
          VER="${TAG#v}"
          SRC=$(sed -n 's/#define CROWMOTION_VERSION "\(.*\)"/\1/p' main/version.h)
          test "$VER" = "$SRC" || { echo "::error::version.h ($SRC) does not match $VER"; exit 1; }

      - name: Enable signed OTA images
        env:
          OTA_SIGNING_KEY_B64: ${{ secrets.OTA_SIGNING_KEY_B64 }}
        run: |
          test -n "$OTA_SIGNING_KEY_B64" || { echo "::error::OTA_SIGNING_KEY_B64 is missing"; exit 1; }
          echo "$OTA_SIGNING_KEY_B64" | base64 -d > ota_signing_key.pem
          cat sdkconfig.ci.signed >> sdkconfig.defaults

      - name: Build ESP32-C3 firmware
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.5.4
          target: esp32c3

      - name: Verify signature and stage release
        run: |
          VER="${TAG#v}"
          pip install --quiet "esptool==4.8.1"
          espsecure.py verify_signature --version 2 --keyfile ota_signing_key.pem build/crowmotion.bin | tee /tmp/verify.txt
          grep -q "verification successful" /tmp/verify.txt || { echo "::error::firmware signature verification failed"; exit 1; }
          rm -f ota_signing_key.pem
          mkdir -p site/flash site/crowmotion
          cp -R flasher/. site/
          printf '/flash/*\n  Access-Control-Allow-Origin: *\n' > site/_headers
          esptool.py --chip esp32c3 merge_bin -o site/flash/crowmotion-merged.bin \
            --flash_mode dio --flash_size 4MB \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0xf000 build/ota_data_initial.bin \
            0x20000 build/crowmotion.bin
          cp build/crowmotion.bin "site/crowmotion/crowmotion-${VER}.bin"
          printf '{"version":"%s","url":"https://updates.crowpilot.in/crowmotion/crowmotion-%s.bin"}\n' \
            "$VER" "$VER" > site/crowmotion/latest.json
          cp site/crowmotion/latest.json site/crowmotion/latest-esp32c3.json
          cat > site/flash/manifest.json <<EOF
          {"name":"CrowMotion","version":"${VER}","new_install_prompt_erase":true,"builds":[{"chipFamily":"ESP32-C3","parts":[{"path":"crowmotion-merged.bin","offset":0}]}]}
          EOF

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${TAG#v}"
          gh release upload "$TAG" "site/crowmotion/crowmotion-${VER}.bin" \
            site/flash/crowmotion-merged.bin --clobber

      - name: Deploy update site
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2fca98f9bd732794c53117b67c5b4593
          command: pages deploy site --project-name crowmotion-updates --branch main
